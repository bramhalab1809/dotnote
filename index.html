<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DotNote</title>
    <link rel="icon" type="image/png" href="assets/logo/logo.png">
    <link rel="apple-touch-icon" href="assets/logo/logo.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="js/config/tailwind-config.js"></script>
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 w-screen overflow-hidden select-none transition-colors duration-300 font-sans">

    <canvas id="bg-dots-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- HOME VIEW -->
    <div id="home-view" class="relative z-10 h-full w-full overflow-hidden view-transition">
        <section id="home-saved-section" aria-label="Saved Letters"
            class="top-notes-shelf relative z-30 w-full overflow-y-auto overflow-x-hidden px-4 sm:px-6 pt-4 sm:pt-5 pb-3">
            <div id="home-letters-grid" class="flex flex-wrap items-start gap-x-4 gap-y-4 pt-2"></div>
        </section>

        <section aria-label="Main Actions" class="fixed inset-0 flex items-center justify-center pointer-events-none z-20 px-4">
            <div class="pointer-events-auto flex items-center justify-center gap-4 sm:gap-9 md:gap-12">
                <button id="btn-open-single" type="button" aria-label="Single Notepad" title="Single Notepad"
                    class="hero-orb w-20 h-20 sm:w-28 sm:h-28 md:w-32 md:h-32 rounded-full bg-white/95 dark:bg-zinc-900/95 border-2 border-zinc-200/90 dark:border-zinc-800 hover:scale-105 active:scale-95 hover:border-blue-500 dark:hover:border-blue-400 flex items-center justify-center transition-all duration-200 group">
                    <i data-lucide="file-text" class="w-8 h-8 sm:w-11 sm:h-11 md:w-12 md:h-12 text-zinc-700 dark:text-zinc-300 group-hover:text-blue-500 transition-colors"></i>
                </button>
                <button id="btn-open-split" type="button" aria-label="Split Notepad" title="Split Notepad"
                    class="hero-orb w-28 h-28 sm:w-36 sm:h-36 md:w-44 md:h-44 rounded-full bg-white/95 dark:bg-zinc-900/95 border-2 border-zinc-200/90 dark:border-zinc-800 hover:scale-105 active:scale-95 hover:border-indigo-500 dark:hover:border-indigo-400 flex items-center justify-center transition-all duration-200 group">
                    <i data-lucide="columns-2" class="w-12 h-12 sm:w-16 sm:h-16 md:w-20 md:h-20 text-zinc-800 dark:text-zinc-200 group-hover:text-indigo-500 transition-colors"></i>
                </button>
                <button id="btn-open-settings" type="button" aria-label="Settings" title="Settings"
                    class="hero-orb w-20 h-20 sm:w-28 sm:h-28 md:w-32 md:h-32 rounded-full bg-white/95 dark:bg-zinc-900/95 border-2 border-zinc-200/90 dark:border-zinc-800 hover:scale-105 active:scale-95 hover:border-emerald-500 dark:hover:border-emerald-400 flex items-center justify-center transition-all duration-200 group">
                    <i data-lucide="settings" class="w-8 h-8 sm:w-11 sm:h-11 md:w-12 md:h-12 text-zinc-700 dark:text-zinc-300 group-hover:text-emerald-500 group-hover:rotate-45 transition-all duration-300"></i>
                </button>
            </div>
        </section>
    </div>

    <!-- EDITOR VIEW -->
    <div id="editor-view" class="relative z-10 hidden h-full w-full flex flex-col bg-white dark:bg-zinc-950">
        <header class="shrink-0 z-30 w-full px-2.5 sm:px-4 pt-2.5 pb-2 flex items-center justify-between gap-2 border-b border-zinc-200/70 dark:border-zinc-800/70 bg-white/95 dark:bg-zinc-950/95">
            <div class="flex items-center gap-1 sm:gap-1.5 min-w-0 flex-1 max-w-md bg-zinc-100/90 dark:bg-zinc-900/90 p-1 rounded-2xl border border-zinc-200/80 dark:border-zinc-800/80 shadow-sm">
                <button id="btn-toggle-sidebar" type="button" aria-label="Saved Letters" title="Saved Letters"
                    class="p-2 sm:p-2.5 rounded-xl hover:bg-white dark:hover:bg-zinc-800 text-zinc-700 dark:text-zinc-300 active:scale-95 transition-all shrink-0">
                    <i data-lucide="panel-left" class="w-5 h-5"></i>
                </button>
                <button id="btn-go-home" type="button" aria-label="Home" title="Home"
                    class="p-2 sm:p-2.5 rounded-xl hover:bg-white dark:hover:bg-zinc-800 text-zinc-700 dark:text-zinc-300 active:scale-95 transition-all shrink-0">
                    <i data-lucide="home" class="w-5 h-5"></i>
                </button>
                <input id="letter-title-input" type="text" spellcheck="false" autocomplete="off" aria-label="Letter Name" placeholder="..."
                    class="min-w-0 flex-1 px-2.5 py-1.5 rounded-xl bg-white dark:bg-zinc-800 border border-zinc-300/80 dark:border-zinc-700/80 text-sm font-medium text-zinc-800 dark:text-zinc-100 placeholder-zinc-400 outline-none focus:border-indigo-500 transition-colors select-text" />
                <div id="save-indicator" aria-hidden="true" class="p-1 text-emerald-500 opacity-0 transition-opacity duration-300 shrink-0">
                    <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                </div>
            </div>

            <div class="flex items-center gap-1 sm:gap-1.5 shrink-0 bg-zinc-100/90 dark:bg-zinc-900/90 p-1 rounded-2xl border border-zinc-200/80 dark:border-zinc-800/80 shadow-sm">
                <button id="btn-download-editor" type="button" aria-label="Download Letter" title="Download"
                    class="p-2 sm:p-2.5 rounded-xl hover:bg-white dark:hover:bg-zinc-800 text-zinc-700 dark:text-zinc-300 active:scale-95 transition-all">
                    <i data-lucide="download" class="w-5 h-5"></i>
                </button>
                <button id="btn-new-editor" type="button" aria-label="New Letter" title="New Letter"
                    class="p-2 sm:p-2.5 rounded-xl hover:bg-white dark:hover:bg-zinc-800 text-zinc-700 dark:text-zinc-300 active:scale-95 transition-all">
                    <i data-lucide="file-plus" class="w-5 h-5"></i>
                </button>
                <button id="mode-switch-btn" type="button" aria-label="Switch Mode" title="Switch Mode"
                    class="p-2 sm:p-2.5 rounded-xl hover:bg-white dark:hover:bg-zinc-800 text-zinc-700 dark:text-zinc-300 active:scale-95 transition-all">
                    <i data-lucide="columns-2" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <aside id="sidebar" aria-label="Saved Letters Sidebar"
            class="fixed inset-y-0 left-0 z-50 w-72 max-w-[82vw] bg-zinc-100/98 dark:bg-zinc-900/98 border-r border-zinc-200 dark:border-zinc-800 transform -translate-x-full transition-transform duration-300 flex flex-col pt-4 pb-4 px-3 shadow-2xl">
            <div class="flex items-center justify-between mb-4 px-1 gap-2 shrink-0">
                <button id="btn-sidebar-new" type="button" aria-label="New Letter" title="New Letter"
                    class="flex-1 flex items-center justify-center p-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-md active:scale-95 transition-all">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
                <button id="btn-sidebar-close" type="button" aria-label="Close Sidebar" title="Close"
                    class="p-3 rounded-xl bg-zinc-200 dark:bg-zinc-800 hover:bg-zinc-300 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-300 active:scale-95 transition-all">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="letters-list" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
            <div class="pt-3 mt-2 border-t border-zinc-200 dark:border-zinc-800 shrink-0">
                <button id="btn-sidebar-settings" type="button" aria-label="Settings" title="Settings"
                    class="w-full p-3 rounded-2xl bg-white dark:bg-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-700 border border-zinc-200 dark:border-zinc-700 text-zinc-700 dark:text-zinc-200 flex items-center justify-center shadow-sm active:scale-95 transition-all">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </div>
        </aside>
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black/30 z-40 hidden"></div>

        <main id="workspace" class="flex-1 flex flex-col md:flex-row min-h-0 w-full overflow-hidden">
            <div id="pane-left" class="relative flex-1 h-full flex flex-col min-w-0 min-h-0">
                <textarea id="editor-left" spellcheck="false" autocomplete="off" aria-label="Primary Editor"
                    class="w-full h-full resize-none bg-transparent px-4 sm:px-8 md:px-10 pt-5 sm:pt-7 pb-20 outline-none text-zinc-800 dark:text-zinc-100 leading-relaxed select-text font-sans"
                    style="font-size: 18px;"></textarea>
                <div class="absolute bottom-3 right-3 sm:bottom-4 sm:right-4 z-20 flex items-center gap-1 opacity-85 sm:opacity-55 hover:opacity-100 focus-within:opacity-100 transition-opacity bg-zinc-100/95 dark:bg-zinc-900/95 p-1 rounded-xl border border-zinc-200/90 dark:border-zinc-800 shadow-sm">
                    <button type="button" data-pane-action="paste" data-pane="left" aria-label="Paste" title="Paste" class="p-2 rounded-lg hover:bg-white dark:hover:bg-zinc-800 text-zinc-600 dark:text-zinc-400 active:scale-90 transition-all"><i data-lucide="clipboard-paste" class="w-4 h-4"></i></button>
                    <button type="button" data-pane-action="copy" data-pane="left" aria-label="Copy" title="Copy" class="p-2 rounded-lg hover:bg-white dark:hover:bg-zinc-800 text-zinc-600 dark:text-zinc-400 active:scale-90 transition-all"><i data-lucide="copy" class="w-4 h-4"></i></button>
                    <button type="button" data-pane-action="download" data-pane="left" aria-label="Download Pane" title="Download" class="p-2 rounded-lg hover:bg-white dark:hover:bg-zinc-800 text-zinc-600 dark:text-zinc-400 active:scale-90 transition-all"><i data-lucide="download" class="w-4 h-4"></i></button>
                    <button type="button" data-pane-action="clear" data-pane="left" aria-label="Clear Pane" title="Clear" class="p-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/50 text-zinc-600 dark:text-zinc-400 hover:text-red-500 active:scale-90 transition-all"><i data-lucide="eraser" class="w-4 h-4"></i></button>
                </div>
            </div>

            <div id="split-divider" role="separator" aria-label="Resize Panes"
                class="resizer hidden bg-zinc-200/90 dark:bg-zinc-800/90 hover:bg-indigo-500 active:bg-indigo-500 transition-colors flex items-center justify-center md:w-2 md:h-full w-full h-3 shrink-0 z-10">
                <div class="md:w-0.5 md:h-10 w-12 h-1 bg-zinc-400 dark:bg-zinc-600 rounded-full pointer-events-none"></div>
            </div>

            <div id="pane-right" class="relative hidden flex-1 h-full flex flex-col min-w-0 min-h-0 bg-zinc-50/70 dark:bg-zinc-900/40">
                <textarea id="editor-right" spellcheck="false" autocomplete="off" aria-label="Secondary Editor"
                    class="w-full h-full resize-none bg-transparent px-4 sm:px-8 md:px-10 pt-5 sm:pt-7 pb-20 outline-none text-zinc-800 dark:text-zinc-100 leading-relaxed select-text font-sans"
                    style="font-size: 18px;"></textarea>
                <div class="absolute bottom-3 right-3 sm:bottom-4 sm:right-4 z-20 flex items-center gap-1 opacity-85 sm:opacity-55 hover:opacity-100 focus-within:opacity-100 transition-opacity bg-zinc-100/95 dark:bg-zinc-900/95 p-1 rounded-xl border border-zinc-200/90 dark:border-zinc-800 shadow-sm">
                    <button type="button" data-pane-action="paste" data-pane="right" aria-label="Paste" title="Paste" class="p-2 rounded-lg hover:bg-white dark:hover:bg-zinc-800 text-zinc-600 dark:text-zinc-400 active:scale-90 transition-all"><i data-lucide="clipboard-paste" class="w-4 h-4"></i></button>
                    <button type="button" data-pane-action="copy" data-pane="right" aria-label="Copy" title="Copy" class="p-2 rounded-lg hover:bg-white dark:hover:bg-zinc-800 text-zinc-600 dark:text-zinc-400 active:scale-90 transition-all"><i data-lucide="copy" class="w-4 h-4"></i></button>
                    <button type="button" data-pane-action="download" data-pane="right" aria-label="Download Pane" title="Download" class="p-2 rounded-lg hover:bg-white dark:hover:bg-zinc-800 text-zinc-600 dark:text-zinc-400 active:scale-90 transition-all"><i data-lucide="download" class="w-4 h-4"></i></button>
                    <button type="button" data-pane-action="clear" data-pane="right" aria-label="Clear Pane" title="Clear" class="p-2 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/50 text-zinc-600 dark:text-zinc-400 hover:text-red-500 active:scale-90 transition-all"><i data-lucide="eraser" class="w-4 h-4"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- SUGGESTION BAR (3 Visible + Scroll & Tab) -->
    <div id="suggestion-bar" class="fixed z-40 hidden items-center gap-1 max-w-[calc(100vw-20px)] bg-white/95 dark:bg-zinc-900/95 border border-zinc-300 dark:border-zinc-700 rounded-xl p-1 shadow-lg select-none">
        <div id="suggestion-track" class="flex items-center gap-1 overflow-x-auto no-scrollbar scroll-smooth" style="max-width: 248px;"></div>
        <button id="suggestion-more-btn" type="button" aria-label="Next Suggestion" title="Next (Tab)"
            class="hidden shrink-0 p-1 rounded-lg text-zinc-400 hover:text-indigo-500 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/45 p-4">
        <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-3xl p-5 sm:p-6 shadow-2xl flex flex-col items-center gap-5 max-w-sm w-full max-h-[88dvh] overflow-hidden">
            <div class="w-full flex justify-end shrink-0">
                <button id="btn-close-settings" type="button" aria-label="Close Settings" class="p-2.5 rounded-full bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-600 dark:text-zinc-300 active:scale-95 transition-all"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="flex items-center gap-4 shrink-0">
                <button id="btn-light" type="button" aria-label="Light Theme" class="p-3.5 rounded-2xl border-2 border-zinc-200 dark:border-zinc-800 hover:border-amber-400 active:scale-95 transition-all"><i data-lucide="sun" class="w-6 h-6 text-amber-500"></i></button>
                <button id="btn-dark" type="button" aria-label="Dark Theme" class="p-3.5 rounded-2xl border-2 border-zinc-200 dark:border-zinc-800 hover:border-indigo-400 active:scale-95 transition-all"><i data-lucide="moon" class="w-6 h-6 text-indigo-400"></i></button>
            </div>
            <div class="flex items-center gap-3 shrink-0">
                <button id="btn-font-dec" type="button" aria-label="Decrease Font Size" class="p-3.5 rounded-2xl bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 active:scale-95 transition-all"><i data-lucide="a-arrow-down" class="w-6 h-6"></i></button>
                <span id="font-size-badge" class="min-w-[3.25rem] text-center text-sm font-semibold text-zinc-600 dark:text-zinc-300 tabular-nums">18px</span>
                <button id="btn-font-inc" type="button" aria-label="Increase Font Size" class="p-3.5 rounded-2xl bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 active:scale-95 transition-all"><i data-lucide="a-arrow-up" class="w-6 h-6"></i></button>
            </div>
            <div class="flex items-center gap-3 shrink-0">
                <button id="font-sans-btn" type="button" aria-label="Sans Font" class="p-3.5 rounded-2xl border-2 border-zinc-200 dark:border-zinc-800 active:scale-95 transition-all"><i data-lucide="type" class="w-5 h-5"></i></button>
                <button id="font-serif-btn" type="button" aria-label="Serif Font" class="p-3.5 rounded-2xl border-2 border-zinc-200 dark:border-zinc-800 active:scale-95 transition-all"><i data-lucide="book-open" class="w-5 h-5"></i></button>
                <button id="font-mono-btn" type="button" aria-label="Monospace Font" class="p-3.5 rounded-2xl border-2 border-zinc-200 dark:border-zinc-800 active:scale-95 transition-all"><i data-lucide="code-2" class="w-5 h-5"></i></button>
            </div>
            <div class="w-full flex-1 min-h-0 flex flex-col border-t border-zinc-200 dark:border-zinc-800 pt-4">
                <div id="settings-notes-list" class="flex-1 overflow-y-auto space-y-2 pr-1 max-h-44"></div>
            </div>
            <div class="w-full flex items-center gap-2.5 shrink-0">
                <button id="btn-settings-download" type="button" aria-label="Download Current Letter" title="Download TXT" class="flex-1 p-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white flex items-center justify-center shadow-lg active:scale-95 transition-all"><i data-lucide="download" class="w-5 h-5"></i></button>
                <button id="btn-backup-export" type="button" aria-label="Backup All Notes JSON" title="Export JSON Backup" class="p-3.5 rounded-2xl bg-indigo-500 hover:bg-indigo-600 text-white flex items-center justify-center shadow-lg active:scale-95 transition-all"><i data-lucide="database-backup" class="w-5 h-5"></i></button>
                <button id="btn-backup-import" type="button" aria-label="Restore Backup JSON" title="Import JSON Backup" class="p-3.5 rounded-2xl bg-zinc-200 dark:bg-zinc-800 hover:bg-zinc-300 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-200 flex items-center justify-center shadow-sm active:scale-95 transition-all"><i data-lucide="upload" class="w-5 h-5"></i></button>
                <input id="backup-import-input" type="file" accept=".json,application/json" class="hidden" />
            </div>
        </div>
    </div>

    <!-- DELETE CONFIRMATION MODAL -->
    <div id="delete-confirm-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/45 p-4">
        <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-3xl p-6 shadow-2xl flex flex-col items-center gap-6 max-w-xs w-full">
            <div class="w-14 h-14 rounded-full bg-red-100 dark:bg-red-950/60 text-red-500 flex items-center justify-center"><i data-lucide="trash-2" class="w-7 h-7"></i></div>
            <div class="flex items-center gap-4 w-full">
                <button id="btn-cancel-delete" type="button" aria-label="Cancel" class="flex-1 p-3.5 rounded-2xl bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-200 flex items-center justify-center active:scale-95 transition-all"><i data-lucide="x" class="w-6 h-6"></i></button>
                <button id="btn-confirm-delete" type="button" aria-label="Confirm Delete" class="flex-1 p-3.5 rounded-2xl bg-red-500 hover:bg-red-600 text-white flex items-center justify-center shadow-lg active:scale-95 transition-all"><i data-lucide="check" class="w-6 h-6"></i></button>
            </div>
        </div>
    </div>

    <!-- ICON TOAST -->
    <div id="toast" aria-live="polite" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-200 bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 p-3 rounded-full shadow-xl flex items-center justify-center">
        <span id="toast-icon-wrap" class="flex items-center justify-center"><i data-lucide="check" class="w-5 h-5"></i></span>
    </div>

    <!-- MODULAR SCRIPTS (All <= 230 lines, works directly via file:// or web server) -->
    <script defer src="js/data/words-part1.js"></script>
    <script defer src="js/data/words-part2.js"></script>
    <script defer src="js/data/words-part3.js"></script>
    <script defer src="js/db/indexeddb.js"></script>
    <script defer src="js/core/state.js"></script>
    <script defer src="js/core/toast.js"></script>
    <script defer src="js/core/self-heal.js"></script>
    <script defer src="js/core/word-learner.js"></script>
    <script defer src="js/ui/home-grid.js"></script>
    <script defer src="js/ui/sidebar-settings.js"></script>
    <script defer src="js/ui/editor-nav.js"></script>
    <script defer src="js/ui/pane-tools.js"></script>
    <script defer src="js/ui/caret-position.js"></script>
    <script defer src="js/ui/suggestions.js"></script>
    <script defer src="js/effects/bg-dots.js"></script>
    <script defer src="js/main.js"></script>
</body>
</html>
